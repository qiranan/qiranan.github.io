
<!DOCTYPE html>

    <!-- meta information -->
<meta charset="utf-8">
<script>
  // 这段必须在首次绘制前跑完，否则会闪白/闪一下页面
  (function () {
    var root = document.documentElement;

    // 1) 主题：先 localStorage，再跟随系统
    var t = null;
    try { t = localStorage.getItem('blog-theme'); } catch (e) { }
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', t);

    // 2) 有 JS 才显示开场/转场遮罩；没有 JS 时页面照常可读
    root.classList.add('js');
    var wantsSplash = root.getAttribute('data-splash') === '1';
    var seen = false;
    try { seen = sessionStorage.getItem('blog-splash') === '1'; } catch (e) { }
    if (wantsSplash && !seen) {
      root.classList.add('has-splash');
    } else {
      // 这次是「进场」，先让转场遮罩合上，再由 JS 打开
      root.classList.add('enter-transition');
    }
  })();
</script>
